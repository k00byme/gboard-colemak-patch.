name: Build Samsung Keyboard Morphe patches

on:
  push:
    branches: [samsung-keyboard]
    paths:
      - "samsung-keyboard/**"
      - ".github/workflows/build-samsung-keyboard.yml"
  pull_request:
    paths:
      - "samsung-keyboard/**"
      - ".github/workflows/build-samsung-keyboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build Morphe patch bundle
        working-directory: samsung-keyboard
        run: gradle :patches:buildAndroid --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Upload .mpp bundle
        uses: actions/upload-artifact@v4
        with:
          name: samsung-keyboard-morphe-patches
          path: samsung-keyboard/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
