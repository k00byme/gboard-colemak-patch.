name: Build Gboard Cafe Morphe patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build Morphe patch bundle
        run: gradle :patches:buildAndroid --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      - name: Package Black Gray custom theme
        run: |
          mkdir -p dist
          cd theme/black-gray
          zip -q -9 "$GITHUB_WORKSPACE/dist/Gboard_Black_Gray_Custom_Theme.zip" \
            metadata.json colors.css style_sheet_md2.css style_sheet_md2_border.css
      - name: Upload .mpp bundle and custom theme
        uses: actions/upload-artifact@v4
        with:
          name: gboard-cafe-morphe-patches
          path: |
            patches/build/libs/*.mpp
            dist/Gboard_Black_Gray_Custom_Theme.zip
          if-no-files-found: error
          retention-days: 14
