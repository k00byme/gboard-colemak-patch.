name: Build native Gboard QWERTZ patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile native Gboard QWERTZ editor and Morphe patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore native QWERTZ source files
        run: unzip -o native-qwertz-source.zip -d .

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Compile the native Gboard settings extension to DEX
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          mkdir -p build/qwertz/classes build/qwertz/dex patches/src/main/resources/extensions
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/qwertz/classes \
            patches/src/main/native/qwertz/QwertzSettingsActivity.java \
            patches/src/main/native/qwertz/QwertzLayoutRuntime.java
          mapfile -d '' class_files < <(find build/qwertz/classes -name '*.class' -print0)
          test "${#class_files[@]}" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 23 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/qwertz/dex \
            "${class_files[@]}"
          test -s build/qwertz/dex/classes.dex
          cp build/qwertz/dex/classes.dex patches/src/main/resources/extensions/qwertz-settings.dex

      - name: Compile .mpp
        run: gradle :patches:buildAndroid --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload compiled patch
        uses: actions/upload-artifact@v4
        with:
          name: gboard-qwertz-native-settings
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
