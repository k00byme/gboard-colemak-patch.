name: Build native Gboard QWERTZ patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Compile native Gboard QWERTZ editor and Morphe patch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore native QWERTZ source files
        run: unzip -o native-qwertz-source.zip -d .

      - name: Fix Dexlib opcode comparison for Gboard 18.5.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("patches/src/main/kotlin/app/gboard/colemak/RemoveColemakSemicolonPatch.kt")
          source = path.read_text()
          old = 'instructions[it].opcode.name == "RETURN_OBJECT"'
          new = 'instructions[it].opcode == com.android.tools.smali.dexlib2.Opcode.RETURN_OBJECT'
          if old not in source:
              raise SystemExit("Expected outdated RETURN_OBJECT comparison was not found")
          path.write_text(source.replace(old, new))
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Compile the native Gboard settings extension to DEX
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("patches/src/main/native/qwertz/QwertzSettingsActivity.java")
          source = path.read_text()
          start = source.find("        preference.setOnPreferenceChangeListener(")
          if start >= 0:
              end_marker = "        });"
              end = source.find(end_marker, start)
              if end < 0:
                  raise SystemExit("Could not find the end of the preference listener")
              end += len(end_marker)
              replacement = """        preference.setOnPreferenceChangeListener(new Preference.OnPreferenceChangeListener() {
                      @Override
                      public boolean onPreferenceChange(Preference item, Object newValue) {
                          String value = String.valueOf(newValue).toLowerCase(Locale.ROOT);
                          if (!isValidRow(value, expectedLength)) {
                              Toast.makeText(QwertzSettingsActivity.this,
                                      "Digite " + expectedLength + " letras diferentes, sem espaços.",
                                      Toast.LENGTH_LONG).show();
                              return false;
                          }
                          return true;
                      }
                  });"""
              path.write_text(source[:start] + replacement + source[end:])
          elif "new Preference.OnPreferenceChangeListener()" not in source:
              raise SystemExit("Could not safely locate the preference listener")
          PY
          mkdir -p build/qwertz/classes build/qwertz/dex patches/src/main/resources/extensions
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/qwertz/classes \
            patches/src/main/native/qwertz/QwertzSettingsActivity.java \
            patches/src/main/native/qwertz/QwertzLayoutRuntime.java
          mapfile -d '' class_files < <(find build/qwertz/classes -name '*.class' -print0)
          test "${#class_files[@]}" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 23 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/qwertz/dex \
            "${class_files[@]}"
          test -s build/qwertz/dex/classes.dex
          cp build/qwertz/dex/classes.dex patches/src/main/resources/extensions/qwertz-settings.dex

      - name: Compile .mpp
        run: gradle :patches:buildAndroid --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload compiled patch
        uses: actions/upload-artifact@v4
        with:
          name: gboard-qwertz-native-settings
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
